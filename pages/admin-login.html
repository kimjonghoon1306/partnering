<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 — 온파트너</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/auth.css">
<style>
  body { background: var(--bg); color: var(--text); }
  .admin-login-glow {
    position: fixed;
    width: 520px; height: 520px;
    border-radius: 50%;
    top: -120px; left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    background: radial-gradient(circle, var(--lime-glow) 0%, transparent 70%);
  }
  .theme-btn-fixed {
    position: fixed; top: 22px; right: 22px; z-index: 10;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--dark3);
    font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .theme-btn-fixed:hover { border-color: var(--lime-border); transform: translateY(-1px); }

  .admin-login-card {
    width: 100%;
    max-width: 460px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 52px 48px;
    position: relative;
    z-index: 1;
    box-shadow: var(--shadow);
  }
  .admin-login-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--lime-glow);
    border: 1px solid var(--lime-border);
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--lime);
    margin-bottom: 22px;
  }
  .al-logo { font-size: 28px; font-weight: 900; letter-spacing: -0.03em; color: var(--text); }
  .al-logo span { color: var(--lime); }
  .al-title { font-size: 28px; font-weight: 900; color: var(--text); letter-spacing: -0.6px; }
  .al-desc { font-size: 15px; color: var(--text2); margin-top: 8px; }
  .al-label { display:block; font-size:12px; font-weight:700; color:var(--text3); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px; }
  .al-input {
    width:100%; background:var(--dark4); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; font-size:16px; color:var(--text); font-family:var(--font);
    outline:none; box-sizing:border-box; transition:border-color 0.2s;
  }
  .al-input:focus { border-color: var(--lime-border); }
  .al-eye {
    position:absolute; right:14px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:19px; color:var(--text3);
  }
  .al-submit {
    width:100%; padding:17px; border-radius:14px; border:none;
    background:var(--lime); color:#0A0A0A; font-size:17px; font-weight:800;
    font-family:var(--font); cursor:pointer; transition:all 0.2s; letter-spacing:-0.3px;
  }
  .al-submit:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: var(--shadow-lime); }
  .al-submit:active { transform: scale(0.98); }
  .al-submit:disabled { opacity: 0.6; cursor: default; transform: none; }
  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)} 40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
</style>
</head>
<body>

<div class="admin-login-glow"></div>
<button class="theme-btn-fixed" id="theme-btn" title="테마 전환">☀️</button>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="admin-login-card">

    <!-- 로고 -->
    <div style="text-align:center;margin-bottom:28px;">
      <div class="al-logo"><span>온</span>파트너</div>
    </div>

    <div style="text-align:center;margin-bottom:34px;">
      <div class="admin-login-badge">⚙️ 관리자 전용</div>
      <div class="al-title">관리자 로그인</div>
      <div class="al-desc">이 페이지는 관리자 전용입니다</div>
    </div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
      <div style="margin-bottom:18px;">
        <label class="al-label">관리자 ID</label>
        <input id="admin-id" class="al-input" type="email" placeholder="관리자 이메일" autocomplete="off">
      </div>

      <div style="margin-bottom:26px;">
        <label class="al-label">비밀번호</label>
        <div style="position:relative;">
          <input id="admin-pw" class="al-input" type="password" placeholder="비밀번호 입력" autocomplete="current-password" style="padding-right:52px;">
          <button type="button" onclick="togglePw()" class="al-eye" id="eye-btn">👁</button>
        </div>
      </div>

      <div id="login-error" style="display:none;background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.25);border-radius:12px;padding:12px 16px;font-size:13px;color:#FF4D6A;text-align:center;margin-bottom:18px;">
        ID 또는 비밀번호가 올바르지 않습니다.
      </div>

      <button type="submit" id="login-btn" class="al-submit">로그인</button>
    </form>

    <div style="text-align:center;margin-top:26px;padding-top:24px;border-top:1px solid var(--border);">
      <a href="../index.html" style="font-size:14px;color:var(--text3);text-decoration:none;">← 메인으로</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/db.js?v=20260816a"></script>
<script>
// ── 테마
(function () {
  var saved = localStorage.getItem('ptnr-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  var btn = document.getElementById('theme-btn');
  function paint(t) { if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙'; }
  paint(saved);
  btn && btn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'dark';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('ptnr-theme', next);
    paint(next);
  });
})();

function togglePw() {
  const input = document.getElementById('admin-pw');
  const btn = document.getElementById('eye-btn');
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁' : '🙈';
}

// Supabase 로그인 + is_admin() 확인
async function handleAdminLogin(e) {
  e.preventDefault();
  const id = document.getElementById('admin-id').value.trim();
  const pw = document.getElementById('admin-pw').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = '로그인 중...'; err.style.display = 'none';

  const fail = (msg) => {
    err.textContent = msg; err.style.display = 'block';
    const f = document.getElementById('admin-login-form');
    f.classList.add('shake'); setTimeout(() => f.classList.remove('shake'), 400);
    btn.disabled = false; btn.textContent = '로그인';
  };
  if (!window.opClient) return fail('연결 오류입니다. 새로고침 해주세요.');

  const { error } = await window.opClient.auth.signInWithPassword({ email: id, password: pw });
  if (error) return fail('이메일 또는 비밀번호가 올바르지 않습니다.');

  const { data: isAdmin } = await window.opClient.rpc('is_admin');
  if (!isAdmin) {
    await window.opClient.auth.signOut();
    return fail('관리자 권한이 없는 계정입니다.');
  }
  window.location.href = 'admin.html';
}
</script>
</body>
</html>
