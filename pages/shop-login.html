<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑몰 로그인 — 파트너링</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<nav class="auth-nav">
  <a href="../index.html" class="auth-nav-logo">파트너<span>링</span></a>
  <div class="auth-nav-right">
    <button class="theme-btn" id="theme-btn" title="테마 전환">☀️</button>
    <a href="login.html" class="auth-nav-link">파트너 로그인</a>
  </div>
</nav>

<div class="auth-glow"></div>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <a href="../index.html">파트너<span>링</span></a>
    </div>

    <!-- 구분 배지 -->
    <div style="text-align:center;margin-bottom:20px;">
      <span style="display:inline-flex;align-items:center;gap:6px;background:rgba(79,195,247,0.1);border:1px solid rgba(79,195,247,0.25);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;color:var(--blue);">
        🛒 쇼핑몰 오너 전용
      </span>
    </div>

    <h1 class="auth-title">쇼핑몰 로그인</h1>
    <p class="auth-sub">입점 신청 시 등록한 담당자 계정으로 로그인하세요</p>

    <form id="shop-login-form" onsubmit="handleShopLogin(event)">
      <div class="form-group">
        <label>이메일</label>
        <input class="form-input" type="email" id="email" placeholder="manager@yourshop.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label>비밀번호</label>
        <div class="form-input-wrap">
          <input class="form-input" type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
          <button type="button" class="input-eye" id="pw-eye">👁</button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <label class="form-check" style="margin-bottom:0;">
          <input type="checkbox" id="remember">
          <div class="check-box">✓</div>
          <span class="check-label">로그인 상태 유지</span>
        </label>
        <a href="#" style="font-size:13px;color:var(--text3);">비밀번호 찾기</a>
      </div>

      <div id="login-error" style="display:none;background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.2);border-radius:10px;padding:10px 14px;font-size:12px;color:#FF4D6A;text-align:center;margin-bottom:12px;">
        이메일 또는 비밀번호를 확인해주세요.
      </div>

      <div style="background:var(--dark4);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text3);margin-bottom:12px;line-height:1.7;">
        📧 테스트 계정<br>
        이메일: <span style="color:var(--lime);font-weight:700;">admin@partnering.com</span><br>
        비밀번호: <span style="color:var(--lime);font-weight:700;">admin1234</span>
      </div>

      <button type="submit" class="auth-submit" id="submit-btn">로그인</button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
      아직 입점 신청을 안 하셨나요? <a href="shop-register.html">입점 신청하기</a>
    </div>

    <!-- 구분선 -->
    <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center;">
      <p style="font-size:12px;color:var(--text3);">파트너(인플루언서)이신가요?</p>
      <a href="login.html" style="font-size:13px;color:var(--text2);font-weight:600;margin-top:4px;display:inline-block;">
        파트너 로그인 →
      </a>
    </div>

    <div style="text-align:center;margin-top:12px;">
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text3);padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);transition:all 0.2s;" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--border-hover)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border)'">
        ← 대문으로 가기
      </a>
    </div>

  </div>
</div>

<script src="../js/auth.js"></script>
<script>
async function hashStr(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function makeToken() {
  return Array.from(crypto.getRandomValues(new Uint8Array(16)))
    .map(b => b.toString(16).padStart(2,'0')).join('');
}

// admin@partnering.com / admin1234 의 SHA-256
const HASH_EMAIL = 'c03c387c5a7b9a6a796f71a6c87d1f2e8b9d4e5a1f3c8d2b7e6a9f4c1b8d5e2a';
const HASH_PW    = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';

async function handleShopLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pw    = document.getElementById('password').value;
  const btn   = document.getElementById('submit-btn');
  const err   = document.getElementById('login-error');
  btn.disabled = true; btn.textContent = '로그인 중...';
  err.style.display = 'none';

  const [hEmail, hPw] = await Promise.all([hashStr(email), hashStr(pw)]);

  setTimeout(() => {
    // 이메일은 해시 대신 직접 비교 (이메일은 공개 정보)
    if (email === 'admin@partnering.com' && hPw === HASH_PW) {
      const token = makeToken();
      sessionStorage.setItem('ptnr_shop', '1');
      sessionStorage.setItem('ptnr_shop_token', token);
      sessionStorage.setItem('ptnr_shop_ts', Date.now().toString());
      window.location.href = 'shop-dashboard.html';
    } else {
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = '로그인';
    }
  }, 600);
}
</script>
</body>
</html>
